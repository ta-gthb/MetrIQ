name: CI

# The gate for every push: the test suite, the schema on a fresh database, and
# the release hygiene check (audit items 2, 5 and 11). A red run means the
# application or the release artefact must not be deployed.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and release gate
    runs-on: ubuntu-latest
    env:
      # The suite provisions its own throwaway SQLite database in the temp
      # folder; these are the values it expects to find in the environment.
      ENVIRONMENT: test
      JWT_SECRET: ci-only-secret-not-for-deployment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install --root-user-action=ignore -r backend/requirements.txt

      - name: Test suite
        working-directory: backend
        run: python -m pytest -q

      - name: Release gate - secrets, packaging and unsupported claims
        run: python backend/scripts/check_release.py

  migrations:
    name: Schema migrations
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      JWT_SECRET: ci-only-secret-not-for-deployment
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install --root-user-action=ignore -r backend/requirements.txt

      - name: A fresh database migrates from zero
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci-migrate.db
          DB_SCHEMA: ""
        run: |
          python scripts/migrate.py upgrade
          python scripts/migrate.py check
          python scripts/migrate.py current

      - name: The tree applies and reverts cleanly
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./ci-downgrade.db
          DB_SCHEMA: ""
        run: |
          python scripts/migrate.py upgrade
          python scripts/migrate.py downgrade base --yes
          python scripts/migrate.py upgrade

      - name: Migrations render for PostgreSQL without a server
        working-directory: backend
        env:
          # Offline mode (--sql) never connects, so this catches dialect-specific
          # mistakes in a migration before a deploy finds them instead.
          DATABASE_URL: postgresql://user:pw@localhost:5432/metriq
          DB_SCHEMA: metriq
        run: alembic -c alembic.ini upgrade head --sql > /tmp/migrations.sql

  rls:
    name: Row-level security on a real PostgreSQL
    runs-on: ubuntu-latest
    # Audit item 14. SQLite has no row-level security, so the unit assertions in
    # the main job cannot prove the policies do anything. This job runs them
    # against a server, as a role that is not the table owner.
    env:
      ENVIRONMENT: test
      JWT_SECRET: ci-only-secret-not-for-deployment
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metriq_rls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install --root-user-action=ignore -r backend/requirements.txt

      - name: Cross-laboratory access is refused, in both directions
        working-directory: backend
        env:
          METRIQ_RLS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/metriq_rls
        run: python -m pytest tests/test_row_level_security.py -q
