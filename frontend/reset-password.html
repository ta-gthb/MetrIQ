<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Choose a new password - MetrIQ</title>
  <link rel="icon" href="/assets/favicon.ico" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/app.css" />
  <!-- Synchronous, so the theme is applied before the first paint; a file
       rather than an inline script so the CSP needs no inline exception. -->
  <script src="/js/theme-boot.js"></script>
</head>
<body class="auth-page" data-theme="dark">
  <div class="auth-toolbar">
    <div class="clock" data-clock role="group" aria-label="Current local date and time">
      <span class="clock-time" data-clock-time>--:--:--</span>
      <span class="clock-date" data-clock-date>&nbsp;</span>
    </div>
    <button class="btn-sm theme-toggle" id="theme-toggle" type="button" data-theme-toggle aria-pressed="false">
      <span class="theme-icon" data-theme-icon aria-hidden="true"></span>
      <span class="theme-toggle-label" data-theme-label>Light</span>
    </button>
  </div>

  <main class="card auth-card">
    <div class="brand" style="margin-bottom:16px">
      <img src="/assets/logo-emblem.png" alt="" width="320" height="241" />
      <div><div class="brand-name">MetrIQ</div>
        <div class="brand-sub">OIML R 76 automation</div></div>
    </div>
    <h1>Choose a new password</h1>
    <div id="notice"></div>

    <!-- The recovery token arrives in the URL fragment, put there by the
         identity provider's email link. It is read by reset-password.js, sent
         only to Supabase, and removed from the address bar again. -->
    <form id="reset-form" novalidate hidden>
      <div class="field">
        <label class="req" for="password">New password</label>
        <input id="password" name="password" type="password" autocomplete="new-password"
               minlength="8" required />
        <div class="faint small">At least 8 characters.</div>
      </div>
      <div class="field">
        <label class="req" for="confirm">Confirm the new password</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" required />
      </div>
      <button class="btn-primary" type="submit" style="width:100%" id="submit">Set the new password</button>
    </form>

    <p class="small muted mt-4">
      <a href="/login.html">Back to sign in</a>
    </p>
  </main>
  <script type="module" src="/js/reset-password.js"></script>
</body>
</html>
