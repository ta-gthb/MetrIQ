<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in - MetrIQ</title>
  <link rel="icon" href="/assets/favicon.ico" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="stylesheet" href="/css/app.css" />
  <!-- Synchronous, so the theme is applied before the first paint; a file
       rather than an inline script so the CSP needs no inline exception. -->
  <script src="/js/theme-boot.js"></script>
</head>
<body class="auth-page">
  <div class="auth-toolbar">
    <div class="clock" data-clock role="group" aria-label="Current local date and time">
      <span class="clock-time" data-clock-time>--:--:--</span>
      <span class="clock-date" data-clock-date>&nbsp;</span>
    </div>
    <button class="btn-sm theme-toggle" id="theme-toggle" type="button" data-theme-toggle aria-pressed="false">
      <span class="theme-icon" data-theme-icon aria-hidden="true">☀</span>
      <span class="theme-toggle-label" data-theme-label>Light</span>
    </button>
  </div>

  <main class="card auth-card">
    <div class="brand" style="margin-bottom:16px">
      <img src="/assets/logo-emblem.png" alt="" width="320" height="241" />
      <div><div class="brand-name">MetrIQ</div>
        <div class="brand-sub">OIML R 76 automation</div></div>
    </div>
    <h1>Sign in</h1>
    <div id="notice"></div>
    <form id="login-form" novalidate>
      <div class="field">
        <label class="req" for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label class="req" for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <p class="small muted" id="reset-link" hidden>
        <a href="#" id="forgot">Forgot your password?</a>
      </p>
      <button class="btn-primary" type="submit" style="width:100%" id="submit">Sign in</button>
    </form>

    <!-- Password reset, offered only when the identity provider can email a
         link; the form is revealed by login.js when the API reports one. -->
    <form id="reset-form" class="mt-4" hidden novalidate>
      <div class="field">
        <label class="req" for="reset-email">Email address</label>
        <input id="reset-email" name="reset-email" type="email" autocomplete="username" required />
      </div>
      <button class="btn" type="submit" style="width:100%" id="reset-submit">Email me a reset link</button>
      <p class="small muted" style="margin-top:8px">
        The link opens a secure page on which you set a new password.
      </p>
    </form>
    <!-- Filled in by login.js, and only while the API reports demo mode. The
         password is deliberately absent from every file in this bundle. -->
    <div class="mt-4" id="demo-panel" hidden>
      <div class="small muted" id="demo-label"></div>
      <div class="demo-accounts" id="demo-accounts"></div>
    </div>
  </main>
  <script type="module" src="/js/login.js"></script>
</body>
</html>
