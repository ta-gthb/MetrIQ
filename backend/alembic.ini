# Alembic configuration for MetrIQ.
#
# No database URL is stored here on purpose: alembic/env.py reads it from the
# same Settings object the application uses (my deploy and my migration can
# therefore never disagree about which database they target), so every
# credential stays in the environment.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
version_path_separator = os
file_template = %%(rev)s_%%(slug)s
# A revision is only ever generated with an explicit message.
revision_environment = false

# The application configures logging; Alembic must not reconfigure it.
[loggers]
keys = root

[handlers]
keys =

[formatters]
keys =

[logger_root]
level = WARNING
handlers =